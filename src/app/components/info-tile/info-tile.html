<div class="text-gray-500 text-sm font-semibold">{{ title }}</div>
@if (isLoading) {
  <p-skeleton height="1.5rem" width="5rem" />
} @else {
  @if (value) {
    <div class="text-black text-lg font-normal whitespace-pre-line">
      @if (icon) {
        <i [class]="`pi pi-${icon}`"></i>
      }
      {{ value }}
    </div>
  } @else {
    <span class="text-gray-400 italic font-normal">{{ noDataMessage }}</span>
  }
}
