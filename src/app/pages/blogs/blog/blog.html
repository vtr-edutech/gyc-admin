<p-button label="Back" size="small" icon="pi pi-arrow-left" routerLink="/blogs" />
<article class="flex p-8 bg-white shadow mt-8 rounded-lg flex-col gap-4 w-[75vw] mx-auto">
  <h2 class="text-2xl font-semibold text-center">{{ blog()?.title }}</h2>
  @if (blog()?.thumbnailUrl) {
    <img [src]="blog()?.thumbnailUrl" alt="Image thumbnail" class="h-auto" />
  }
  <div class="ql-bubble">
    <div class="ql-editor" [innerHTML]="blog()?.content"></div>
  </div>
  <div class="flex justify-between items-center">
    <div class="flex flex-col gap-1">
      <i class="text-gray-600">Written by</i>
      <div class="flex gap-1 items-center">
        <p-avatar
          icon="pi pi-user"
          class="mr-2"
          size="large"
          shape="circle"
          [label]="this.authService.userNameLabel()"
        />
        <span>{{ this.authService.authState().data?.data?.name }}</span>
      </div>
      <p class="text-gray-500">on {{ blog()?.createdAt | formatDate }}</p>
    </div>
    <div class="flex items-start gap-3 text-sm *:gap-1">
      <div class="flex items-center">
        <i class="pi pi-eye"></i>
        <span>{{ blog()?.views || 0 }}</span>
      </div>
      <div class="flex items-center">
        <i class="pi pi-heart"></i>
        <span>{{ blog()?.likes || 0 }}</span>
      </div>
      <div class="flex items-center">
        <i class="pi pi-share-alt"></i>
        <span>{{ blog()?.shares || 0 }}</span>
      </div>
    </div>
  </div>
</article>
