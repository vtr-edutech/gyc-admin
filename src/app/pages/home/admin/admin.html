<div class="grid grid-cols-5 mt-4 gap-4">
  <app-value-card
    title="Users"
    [isLoading]="isLoading()"
    [value]="homeService.homeData().data?.data?.totalUsers"
    color="green"
  ></app-value-card>
  <app-value-card
    title="Attendees"
    [isLoading]="isLoading()"
    [value]="homeService.homeData().data?.data?.totalAttendees"
    color="blue"
  ></app-value-card>
  <app-value-card
    title="Referrers"
    [isLoading]="isLoading()"
    [value]="homeService.homeData().data?.data?.totalReferrers"
    color="orange"
  ></app-value-card>
  <app-value-card
    title="Slot Bookings"
    [isLoading]="isLoading()"
    [value]="homeService.homeData().data?.data?.totalSlotBookings"
    color="pink"
  ></app-value-card>
  <app-value-card
    title="Announcements"
    [isLoading]="isLoading()"
    [value]="homeService.homeData().data?.data?.totalAnnouncements"
    color="gray"
  ></app-value-card>
  <app-value-card
    title="Blogs"
    [isLoading]="isLoading()"
    [value]="homeService.homeData().data?.data?.totalBlogs"
    color="gray"
  ></app-value-card>
  <app-value-card
    title="Admission queries"
    [isLoading]="isLoading()"
    [value]="homeService.homeData().data?.data?.totalAdmissions"
    color="yellow"
  ></app-value-card>
  <app-value-card
    title="Colleges"
    [isLoading]="isLoading()"
    [value]="homeService.homeData().data?.data?.totalColleges"
    color="purple"
  ></app-value-card>
  <app-value-card
    title="Choice List usages"
    [isLoading]="isLoading()"
    [value]="homeService.homeData().data?.data?.totalChoiceListUsages"
    color="amber"
  ></app-value-card>
  <app-value-card
    title="TNEA suggestion usages"
    [isLoading]="isLoading()"
    [value]="homeService.homeData().data?.data?.totalTneaSuggestionUsages"
    color="sky"
  ></app-value-card>
</div>
<div class="flex flex-col gap-4 mt-8">
  <h3 class="text-xl font-semibold">User sign up trend</h3>
  <div>
    <p-chart
      type="line"
      [responsive]="true"
      [height]="'60vh'"
      [data]="homeService.homeData().data?.data?.signUpTrend"
      [plugins]="plugins"
      [options]="chartOptions"
    ></p-chart>
  </div>
</div>
